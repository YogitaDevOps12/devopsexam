apiVersion: apps/v1
kind: ConfigMap
metadata:
  name: app-config
data:
  FLASK_APP: "app.py"
  FLASK_ENV: "production"
  MYSQL_HOST: "mysql"
  MYSQL_USER: "root"
  MYSQL_DATABASE: "devops_exam"
---
apiVersion: apps/v1
kind: ConfigMap
metadata:
  name: db-init-script
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS devops_exam;
    USE devops_exam;

    CREATE TABLE IF NOT EXISTS results (
        id INT AUTO_INCREMENT PRIMARY KEY,
        username VARCHAR(255) NOT NULL,
        gender VARCHAR(50),
        email VARCHAR(255),
        score INT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );


